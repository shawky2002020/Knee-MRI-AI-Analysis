<div class="page">
  <img src="/assets/cover/i1.avif" alt="bg" #bgEl>
<div class="container" #containerEl>
  <h2>Register</h2>
  
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" #formEl>
    <div class="form-group">
      <label for="name">Full Name</label>
      <input id="name" formControlName="name" type="text" placeholder="Enter your full name" />
      <small *ngIf="registerForm.controls['name'].invalid && registerForm.controls['name'].touched">
        Name is required.
      </small>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" formControlName="email" type="email" placeholder="Enter your email" />
      <small *ngIf="registerForm.controls['email'].invalid && registerForm.controls['email'].touched">
        Enter a valid email.
      </small>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password" placeholder="Enter password" />
      <small *ngIf="registerForm.controls['password'].invalid && registerForm.controls['password'].touched">
        Password must be at least 6 characters.
      </small>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" formControlName="confirmPassword" type="password" placeholder="Confirm password" />
      <small *ngIf="registerForm.hasError('passwordMismatch') && registerForm.controls['confirmPassword'].touched">
        Passwords do not match.
      </small>
    </div>

    <div class="btn-container">
  
      <button type="submit" [disabled]="registerForm.invalid">Register</button>
    </div>
    
    <div class="new">
      <hr>
      <p>Already have an account? <a routerLink="/auth/login">Login</a></p>
    </div>
  </form>
</div>
</div>

<div class="dashboard">
  <div class="head-container">
    <div class="title">
      <h1>Dashboard</h1>
    </div>
    
  </div>
  
    <main *ngIf="!loading" class="content">

      <section class="stats" #cardcontainerEl>
        <div class="card ai-status">
          <h3>AI Status</h3>
          <div *ngIf="user.aiAccess" class="status-wrap">

            <p class="enabeled" >
              <i class="fas fa-check-circle"></i>
              <strong>Active</strong>
            </p>
          </div>
          <div *ngIf="!user.aiAccess" class="status-wrap">

          <p class="disabeled" >
            <i class="fas fa-times-circle"></i>
            <strong>Blocked</strong>
          </p>
          </div>
        </div>
        <div class="card patients" #card>
          <h3>Scans</h3>
          <p>
            {{totalScans}}
          </p>
        </div>
        <div class="card reports">
          <h3>Reports</h3>
          <p>45</p>
        </div>
      </section>

      <section *ngIf="!latestScans.length && !loading" class="recent-analysis empty-state" #recentEl>
        <div class="empty-icon">
          <svg width="64" height="64" fill="none" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="30" fill="#f3f4f6"/>
            <path d="M20 40c0-6.627 5.373-12 12-12s12 5.373 12 12" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"/>
            <circle cx="32" cy="28" r="4" fill="#a3a3a3"/>
          </svg>
        </div>
        <h2>No Recent MRI Scans</h2>
        <p class="empty-message">You haven't uploaded or analyzed any MRI scans yet.<br>Start by uploading a new scan to see results here.</p>
      </section>
      <section *ngIf="latestScans.length" class="recent-analysis" #recentEl>
        <h2>Recent MRI Scans</h2>
        <ul *ngFor="let scan of latestScans">
          <li>
            <span class="scan-id">#{{scan._id}}</span> 
            <span class="scan-name">{{scan.metadata.name}}</span> 
            <span class="scan-status">{{scan.result.status}}</span>
          </li>
        </ul>
      </section>
    </main>
  </div>
  <app-loader [shade]="true" [loader]="true" *ngIf="loading"></app-loader>

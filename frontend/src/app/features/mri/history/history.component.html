<div class="container">
  <app-popup
  [title]=" 'Delete Report' "
  [message]=" 'Are you sure you want to delete this report?' "
  [confirmButtonText]=" 'Delete' "
  [cancelButtonText]=" 'Cancel' "
  [showPopup]="showPopup"
  (confirmEmitter)="confirmDelete($event)"
  (closeEmitter)="cancelDelete($event)"
  ></app-popup>

  <img src="/assets/holo/holo1.jpg" alt="" class="back" />

  <app-header id="top" [title]="'Previous Scans'"></app-header>
  <header>
    <app-scan-filter
      [searchTerm]="searchTerm"
      [selectedStatus]="selectedStatus"
      [selectedDate]="selectedDate"
      (search)="search($event)"
      (reset)="reset()"
      (statusChange)="selectStatus($event)"
      (dateChange)="selectDate($event)">
    </app-scan-filter>
  </header>

  <div class="cards-wrapper">
    <app-loader  [loader]="true" *ngIf="loading"></app-loader>

    <div class="card" *ngFor="let scan of mriScans; let i = index">
      <!-- <img src="/assets/holo/holo2.jpg" alt="" class="bg" /> -->
      <div class="card-content" [ngClass]="{ big: i % 2 === 0 }">
        <div class="card-header">
          <div class="patient-details">
            <div class="patient-name">{{ scan.metadata.name }}</div>
            <div class="scan-id">#{{ scan._id }}</div>
          </div>
        </div>
        <div class="badges">
          <span
            class="diagnosis-badge"
            [ngClass]="{ 
              danger: scan.result.status === 'acl' || scan.result.status === 'meniscus' || scan.result.status ==='acl and meniscus',
               }"
          >
            {{ scan.result.status }}
          </span>
          <span *ngIf="scan.metadata.viewed" class="reviewed-badge reviewed"
            >Reviewed</span
          >
          <span *ngIf="!scan.metadata.viewed" class="reviewed-badge pending"
            >Pending</span
          >
        </div>
        <div class="scan-date">{{ scan.createdAt | date : "d MMMM, y" }}</div>

        <div class="actions-row">
          <a (click)="viewDetails(scan)" class="view-report">View Report</a>
          <button class="delete-btn" (click)="popUpShow(scan._id)" >
            <i class="fa-solid fa-trash"></i>
          </button>
  
          <button class="download-btn">
            <i class="fa-solid fa-download"></i>
          </button>
        </div>
      </div>
    </div>
    <div *ngIf="!mriScans.length && !loading" class="not-found">
      <div class="not-found-content">
        <i class="fas fa-file-medical fa-4x"></i>
        <div class="not-found-text">
          <h3>No Scans Found</h3>
          <p>There are currently no MRI scans available to display.</p>
        </div>
      </div>
    </div>
  </div>
  <!-- Pagination Controls -->
  <app-pagination
    *ngIf="totalPages > 1"
    [page]="page"
    [totalPages]="totalPages"
    [paginationWindow]="paginationWindow"
    (pageChange)="goToPage($event)">
  </app-pagination>
</div>

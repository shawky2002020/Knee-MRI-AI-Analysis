<div class="container">
  <img src="/assets/holo/holo1.jpg" alt="" class="bg back">

  <app-header [title]="'Previous Scans'"></app-header>
  <header>
    <div class="search-bar">
      <div class="search-input-container">
        <button class="search-btn" (click)="searchScans()">
          <i class="fas fa-search"></i>
        </button>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search by name"
          (keyup.enter)="searchScans()"
        />
      </div>

      <button class="reset-btn" (click)="loadScans()" type="button">
        <i class="fas fa-undo"></i>
        Reset
      </button>
    </div>

    <div class="filters-container">
      <div class="filter-options">
        <label>
          <select [(ngModel)]="selectedStatus" (change)="filterScans()">
            <option hidden selected>Diagnostic status</option>
            <option value="">All</option>
            <option value="Positive">Positive</option>
            <option value="Negative">Negative</option>
          </select>
        </label>
      </div>

      <div class="filter-options">
        <label>
          <select [(ngModel)]="selectedDate" (change)="filterScans()">
            <option hidden selected>Date</option>
            <option value="today">Today</option>
            <option value="last7">Last 7 Days</option>
            <option value="last30">Last 30 Days</option>
          </select>
        </label>
      </div>

      <div class="btn-container">
        <button class="filter-btn" (click)="filterScans()">Filter</button>
      </div>
    </div>
  </header>

  <div class="cards-wrapper">
    <div class="card" *ngFor="let scan of mriScans,let i =index">
      <img src="/assets/holo/holo2.jpg" alt="" class="bg">
      <div class="card-content" [ngClass]="{big : i%2 === 0}">
        <div class="card-header">
          <div class="patient-details">
            <div class="patient-name">{{ scan.metadata.name }}</div>
            <div class="scan-id">#{{ scan.userId }}</div>
          </div>
        </div>
        <div class="badges">
          <span
            class="diagnosis-badge"
            [ngClass]="{ 
              danger: scan.result.status === 'ACL' || scan.result.status === 'meniscus' || scan.result.status ==='ACL and meniscus',
               }"
          >
            {{ scan.result.status }}
          </span>
            <span *ngIf="scan.metadata.viewed" class="reviewed-badge reviewed">Reviewed</span>
            <span *ngIf="!scan.metadata.viewed" class="reviewed-badge pending">Pending</span>
        </div>
        <div class="scan-date">{{ scan.createdAt | date : "d MMMM, y" }}</div>

        <div class="actions-row">
          <a (click)="viewDetails(scan)" class="view-report">View Report</a>
          <button class="delete-btn">
            <i class="fa-solid fa-trash"></i>
          </button>
          <button class="download-btn">
            <i class="fa-solid fa-download"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

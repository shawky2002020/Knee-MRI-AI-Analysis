<div class="container">
  <app-header [title]="'Previous Scans'"></app-header>
  
  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Search by scan name"
      (keyup.enter)="searchScans()"
    />
    <button (click)="searchScans()">Search</button>
    <button (click)="loadScans()" type="button">Reset</button>
  </div>

  <div class="cards-wrapper">
    <div class="card" *ngFor="let scan of mriScans">
      <div class="card-content">
        <div class="id"> {{scan._id}} </div>
        <div class="status">Key Finding : {{ scan.result.status }}</div>
        <div class="btn-container">
          <button (click)="viewDetails(scan)" class="view-btn">
            View Report
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

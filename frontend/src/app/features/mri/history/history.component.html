<div class="container">
  <div class="cards-wrapper">
    <div class="card" *ngFor="let scan of mriScans">
      <div class="sub-card">
        <figure>
          <img loading="lazy" [src]="scan.imageUrl" alt="scan">
        </figure>
        <div class="type">{{ scan.metadata.type }}</div>
        <div class="view">{{ scan.metadata.view }}</div>
      </div>
    </div>
  </div>
</div>


<div class="upload-page">
    <div class="upload-step-header">
      <div>
        <h2>Upload MRI Scans</h2>
        <p class="upload-desc">
          Please upload <span class="highlight">all three required views</span> of the patient's knee MRI.<br>
          This is the final step before analysis and receiving results.
        </p>
      </div>
    </div>
    <div class="upload-container">
      <!-- <img class="bg" src="/assets/holo/shape3.png" alt="bg" #bgEl> -->
      <div class="text">
        <h3>
          Required Views:
        </h3>
        <ul class="views-list">
          <li><i class="fas fa-circle-notch axial"></i> Axial View</li>
          <li><i class="fas fa-circle-notch coronal"></i> Coronal View</li>
          <li><i class="fas fa-circle-notch sagittal"></i> Sagittal View</li>
        </ul>
        <div class="formats">
          <p>
            Supported formats: <br />
            JPG, JPEG, PNG, DICOM
          </p>
        </div>
      </div>
      <div class="file-uploader-container" #uploadEl>
        <div class="file-uploader">
          <app-file-uploader
            class="axial"
            [view_type]="'axial'"
            (uploadSuccess)="onUploadSuccess($event)"
          ></app-file-uploader>
          <app-file-uploader
            class="coronal"
            [view_type]="'coronal'"
            (uploadSuccess)="onUploadSuccess($event)"
          ></app-file-uploader>
          <app-file-uploader
            class="sagittal"
            [view_type]="'sagittal'"
            (uploadSuccess)="onUploadSuccess($event)"
          ></app-file-uploader>
        </div>
      </div>
      <div *ngIf="uploadedFileUrls.length" class="uploaded-preview">
        <h3>Uploaded File:</h3>
        <img [src]="uploadedFileUrls" alt="Uploaded MRI Scan" />
      </div>
    </div>
  </div>

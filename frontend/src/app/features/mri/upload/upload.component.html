<div class="page">
  <app-header [title]="'Upload page'"></app-header>
  <!-- <video #video autoplay muted loop playsinline id="myVideo">
    <source src="/assets/light/ball.mp4" type="video/mp4" />
    <source src="/assets/light/ball.webm" type="video/webm" />
    Your browser does not support the video tag.
  </video> -->

  <div class="upload-page">
    <div class="upload-container">
      <img class="bg" src="/assets/holo/ai2.jpg" alt="bg" #bgEl> 
      <div class="text">`
        <h3>
          Please upload all three required <br> views of the knee MRI for analysis
        </h3>
        <div class="formats">
          <p>
            Supported formats: <br />
            JPG, JPEG, PNG, DICOM
          </p>
        </div>
      </div>
      <div class="file-uploader-container" #uploadEl>
        <div class="file-uploader">
          <app-file-uploader
            class="axial"
            [view_type]="'axial'"
            (uploadSuccess)="onUploadSuccess($event)"
          ></app-file-uploader>
          <app-file-uploader
            class="coronal"
            [view_type]="'coronal'"
            (uploadSuccess)="onUploadSuccess($event)"
          ></app-file-uploader>
          <app-file-uploader
            class="sagittal"
            [view_type]="'sagittal'"
            (uploadSuccess)="onUploadSuccess($event)"
          ></app-file-uploader>
        </div>
      </div>

      <div *ngIf="uploadedFileUrls.length" class="uploaded-preview">
        <h3>Uploaded File:</h3>
        <img [src]="uploadedFileUrls" alt="Uploaded MRI Scan" />
      </div>
    </div>
  </div>
</div>

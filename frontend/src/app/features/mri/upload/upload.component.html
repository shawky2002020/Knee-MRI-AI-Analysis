<div class="page">
  <app-header [title]="'Upload Page'"></app-header>
<div class="upload-page">
  <h2>Upload MRI Scan</h2>
  
  <app-file-uploader (uploadSuccess)="onUploadSuccess($event)"></app-file-uploader>

  <div *ngIf="uploadedFileUrl" class="uploaded-preview">
    <h3>Uploaded File:</h3>
    <img [src]="uploadedFileUrl" alt="Uploaded MRI Scan">
  </div>
</div>

<app-history></app-history>
</div>

<div class="page">
  <app-header [title]="'Upload page'"></app-header>
  <!-- <video #video autoplay muted loop playsinline id="myVideo">
    <source src="/assets/light/ball.mp4" type="video/mp4" />
    <source src="/assets/light/ball.webm" type="video/webm" />
    Your browser does not support the video tag.
  </video> -->

  <div class="upload-page">
    <div class="main-text">
      <p class="title">
        Please upload all three required views of the knee MRI for analysis
      </p>
    </div>
    <div class="upload-container">


    </div>

    <div class="file-uploader" #uploadEl>
      <app-file-uploader
        [view_type]="'axial'"
        (uploadSuccess)="onUploadSuccess($event)"
      ></app-file-uploader>
      <app-file-uploader
        [view_type]="'coronal'"
        (uploadSuccess)="onUploadSuccess($event)"
      ></app-file-uploader>
      <app-file-uploader
        [view_type]="'sagittal'"
        (uploadSuccess)="onUploadSuccess($event)"
      ></app-file-uploader>
    </div>

    <div *ngIf="uploadedFileUrls.length" class="uploaded-preview">
      <h3>Uploaded File:</h3>
      <img [src]="uploadedFileUrls" alt="Uploaded MRI Scan" />
    </div>
  </div>
</div>

<div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>User List</h2>
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <td>{{ user._id }}</td>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td>01029019830</td>
              <td>Nasr city</td>
              <td>
                <button class="btn btn-danger" (click)="deleteUser(user._id)">Delete</button>
              </td>
            </tr>      
          </tbody>
        </table>
      </div>
    </div>
  </div>

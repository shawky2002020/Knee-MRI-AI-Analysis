<div class="container">
    <div class="title">
      <h1>{{ title }}</h1>
    </div>
    <ul class="links-wrapper">
      <li class="notification-bell" (click)="showNotifications()"><i class="fa-solid fa-bell"></i></li>
      <app-notification [isVisible]="showNotificationsMenu" (VisibleEmitter)="handleEmitter($event)" *ngIf="showNotificationsMenu"></app-notification>
    </ul>
  </div>

<div class="file-uploader">
  <div class="upload-container" *ngIf="!selectedFiles.length">
    <div class="upload-box">
      <input
        type="file"
        class="file-input"
        (change)="onFileSelected($event)"
        #fileInput
        multiple
        accept=".jpg,.jpeg,.png,.dicom"
        hidden
      />
      
      <div
        class="drop-zone"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)"
      >
        <div class="upload-prompt">
          <i class="fa fa-cloud-upload"></i>
          <p class="view-title">{{ view_type }} View</p>
          <p class="view-sub" *ngIf="view_type == 'axial'">Top View </p>
          <p class="view-sub" *ngIf="view_type == 'sagittal'">Side View </p>
          <p class="view-sub" *ngIf="view_type == 'coronal'">Front View </p>
        </div>
        <button class="choose-btn" (click)="fileInput.click()" > Choose files</button>
      </div>
      
      <!-- <div class="drop-zone" 
           (click)="fileInput.click()"
           (dragover)="onDragOver($event)"
           (drop)="onDrop($event)">
        <div class="upload-prompt">
          <i class="fa fa-cloud-upload"></i>
          <p>Drag and drop files here or click to browse</p>
          <p class="small">Supported formats: JPG, JPEG, PNG, DICOM</p>
        </div>
      </div> -->
    </div>
  </div>



  <div class="preview-container" *ngIf="selectedFiles.length > 0">
    <h3>Selected Files ({{ selectedFiles.length }})</h3>

    <div class="file-previews">
      <div
        class="file-preview"
        *ngFor="let file of selectedFiles; let i = index"
      >
        <div class="preview-image">
          <img *ngIf="previewUrls[i]" [src]="previewUrls[i]" alt="Preview" />
          <div *ngIf="!previewUrls[i]" class="loading-preview">
            Loading preview...
          </div>
        </div>
        <div class="file-info">
          <p class="file-name">{{ file.name }}</p>
          <p class="file-size">{{ (file.size / 1024).toFixed(2) }} KB</p>
          <div class="progress-bar" *ngIf="isUploading">
            <div class="progress" [style.width.%]="uploadProgress[i]"></div>
            <span>{{ uploadProgress[i] }}%</span>
          </div>
          <button
            class="remove-btn"
            (click)="removeFile(i)"
            *ngIf="!isUploading"
          >
            Remove
          </button>
        </div>
      </div>
    </div>

    <div class="upload-actions">
      <button
        class="upload-btn"
        (click)="uploadFiles()"
        [disabled]="isUploading"
      >
        <i class="fa fa-upload"></i> Upload All Files
      </button>
      <button
        class="cancel-btn"
        (click)="resetUpload()"
        [disabled]="isUploading"
      >
        <i class="fa fa-times"></i> Cancel
      </button>
    </div>
  </div>
</div>

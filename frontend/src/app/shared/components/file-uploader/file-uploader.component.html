<div class="file-uploader">
  <div class="upload-container" *ngIf="!selectedFiles.length">
    <div class="upload-box">
      <input
        type="file"
        class="file-input"
        (change)="onFileSelected($event)"
        #fileInput
        multiple
        accept=".jpg,.jpeg,.png,.dicom"
        hidden
      />
      
      <div
        class="drop-zone"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)"
      >
        <div class="upload-prompt">
          <i [ngClass]="{
                'icon-axial': view_type === 'axial',
                'icon-coronal': view_type === 'coronal',
                'icon-sagittal': view_type === 'sagittal'
              }" class="fa fa-cloud-upload"></i>
          <p class="view-title">{{ view_type }} View</p>
          <p class="view-sub" *ngIf="view_type == 'axial'">Top View </p>
          <p class="view-sub" *ngIf="view_type == 'sagittal'">Side View </p>
          <p class="view-sub" *ngIf="view_type == 'coronal'">Front View </p>
        </div>
        <i *ngIf="uploadFinished"  class="fa fa-check-circle"></i>

        <button *ngIf="!uploadFinished && !uploadStarted" class="choose-btn" (click)="fileInput.click()" > Choose files</button>
      </div>
      
      <!-- <div class="drop-zone" 
           (click)="fileInput.click()"
           (dragover)="onDragOver($event)"
           (drop)="onDrop($event)">
        <div class="upload-prompt">
          <i class="fa fa-cloud-upload"></i>
          <p>Drag and drop files here or click to browse</p>
          <p class="small">Supported formats: JPG, JPEG, PNG, DICOM</p>
        </div>
      </div> -->
    </div>
  </div>



  <div class="preview-container" *ngIf="selectedFiles.length > 0">
    <h3>Selected Files ({{ selectedFiles.length }})</h3>
    <div class="file-previews minimal-preview">
      <div class="file-status-badge-wrapper" *ngFor="let file of selectedFiles; let i = index">
        <!-- Progress Circle Animation -->
        <div class="progress-circle-container" *ngIf="isUploading && uploadProgress[i] < 100">
          <div class="progress-circle" [style.background]="getProgressBackground(i, uploadProgress[i])">
            <div class="progress-circle-inner">
              <span>{{ uploadProgress[i] }}%</span>
            </div>
          </div>
        </div>
        <!-- Success Checkmark for completed uploads -->
        <div class="upload-complete" *ngIf="uploadProgress[i] === 100">
          <i class="fa fa-check-circle"></i>
        </div>
        <span class="file-status-badge futuristic-badge" [ngClass]="{
            'badge-pending': isUploading && uploadProgress[i] < 100,
            'badge-finished': !isUploading && uploadProgress[i] === 100
          }">
          {{ isUploading && uploadProgress[i] < 100 ? 'Pending' : (uploadProgress[i] === 100 ? 'Finished' : 'Pending') }}
        </span>
        <span class="file-name-badge">{{ file.name }}</span>
      </div>
    </div>
    <div class="upload-actions">
      <button class="upload-btn" (click)="uploadFiles()" [disabled]="isUploading">
        <i class="fa fa-upload"></i> Upload All Files
      </button>
      <button class="cancel-btn" (click)="resetUpload()" [disabled]="isUploading">
        <i class="fa fa-times"></i> Cancel
      </button>
    </div>
  </div>
</div>

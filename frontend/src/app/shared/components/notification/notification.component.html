<div class="notifications" *ngIf="isVisible" #notificationsContainer>
  <div class="loading" *ngIf="loading">
    <app-loader [shade]="true"></app-loader>
  </div>
  <!-- <img src="/assets/holo/ai1.jpg" alt="" class="back"> -->
  <button class="close-view-btn" (click)="closeNotificationView()"><i class="fa fa-times"></i></button>
  
  <!-- No notifications state -->
  <div class="no-notifications" *ngIf="!loading && notifications && notifications.length === 0">
    <div class="no-notifications-icon">
      <i class="fa fa-bell-slash" aria-hidden="true"></i>
    </div>
    <div class="no-notifications-content">
      <h3 class="no-notifications-title">No Notifications</h3>
      <p class="no-notifications-message">You're all caught up! No new notifications at this time.</p>
    </div>
  </div>
  
  <!-- Notifications list -->
  <div class="notification" *ngFor="let notification of notifications; let i = index">
    <div class="notification-icon">
      <i class="fa fa-bell" aria-hidden="true"></i>
    </div>
    <div class="notification-content">
      <div class="notification-title">
        {{notification.title}} 
      </div>
      <div class="notification-message">
        {{notification.message}}
      </div>
    </div>
    <button class="read-btn" (click)="readNotification(i)">mark as read</button>
  </div>
</div>
